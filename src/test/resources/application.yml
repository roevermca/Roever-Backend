server:
  port: 0

spring:
  application:
    name: attendance-management-system-test
  datasource:
    url: jdbc:h2:mem:ams_test_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

firebase:
  credentials:
    path: ""
    json: ""
  project-id: "test-ams-project"

cors:
  allowed-origins: "http://localhost:5173"
